context:
  name: sofa-beamadapter
  version: "26.06"
  major_minor: ${{ (version | split('.'))[:2] | join('.') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/sofa-framework/BeamAdapter/archive/refs/tags/release-v${{ major_minor }}.tar.gz
  sha256: 3384c6a5031b7d6ad36562e75b1d911d7e55d06d12cd1da6873fa86cde63a5bf

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - sofa-devel ${{ major_minor }}.*
    - eigen
  run:
    # sofa-beamadapter is a devel library so it needs sofa-devel at runtime
    - sofa-devel ${{ major_minor }}.*
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - BeamAdapter/BeamAdapter/config.h
      lib:
        - BeamAdapter
  # Load the plugin from Python and step a catheter deployment scene, so a
  # package that installs but cannot simulate fails here.
  - script:
      - python run_test_beam.py
    files:
      recipe:
        - run_test_beam.py
    requirements:
      run:
        - python
        - numpy
        - sofa-python3 ${{ major_minor }}.*
  - script:
      - cmake-package-check BeamAdapter
    requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}

about:
  homepage: https://www.sofa-framework.org/applications/plugins/timoshenko-beam-catheters/
  summary: Plugin implementing Kirchhoff rods to simulate any 1D flexible structure.
  license: LGPL-2.1-or-later
  license_file: LICENSE.md
  documentation: https://sofa-framework.github.io/BeamAdapter/
  repository: https://github.com/sofa-framework/BeamAdapter

extra:
  recipe-maintainers:
    - olivier-roussel
    - hugtalbot
    - bakpaul
